[build]
  publish = ".next"
  command = "pnpm build"

# Pin the serverless Functions runtime (the Node version API routes run on).
# This is SEPARATE from the build Node version (`.nvmrc` = 20). Without this,
# the functions runtime can lag behind on a stale value pinned in the Netlify UI
# (Netlify warned it was Node 16.x, deprecated). Keep this in sync with `.nvmrc`.
[functions]
  node_bundler = "esbuild"

[build.environment]
  AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[plugins]]
  package = "netlify-plugin-cache"

  [plugins.inputs]
    paths = [".next/cache"]

## itp blog redirect
[[redirects]]
  from = "/itp-blog*"
  to = "https://danblog.netlify.app/itp-blog/:splat"
  status = 200
  force = true # COMMENT: ensure that we always redirect
  headers = {X-From = "Netlify"}
  signed = "API_SIGNATURE_TOKEN"

## blog redirect
[[redirects]]
  from = "/resume*"
  to = "https://dano-resume.netlify.app/resume/:splat"
  status = 200
  force = true # COMMENT: ensure that we always redirect
  headers = {X-From = "Netlify"}
  signed = "API_SIGNATURE_TOKEN"

## www.danoved.xyz => danoved.xyz
[[redirects]]
  from = "https://www.danoved.xyz/*"
  to = "https://danoved.xyz/:splat"
  status = 301
  force = true

## www.danioved.com => danoved.xyz
[[redirects]]
  from = "https://www.danioved.com*"
  to = "https://danoved.xyz/:splat"
  status = 301
  force = true # COMMENT: ensure that we always redirect
  headers = {X-From = "Netlify"}
  signed = "API_SIGNATURE_TOKEN"

## danoved.com => danoved.xyz
[[redirect]]
  from = 'https://danoved.com/*'
  to = 'https://danoved.xyz/:splat'
  status = 301
  force = true
